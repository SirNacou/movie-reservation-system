version: "3"

vars:
  API_DIR: apps/api
  DOCKER_SERVICE: api

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Database Migrations (Run on the host)
  # ---------------------------------------------------------------------------
  migration:create:
    desc: Create a new migration diff
    cmds:
      - bun --env-file=../../.env run --cwd {{.API_DIR}} migration:create -- {{.CLI_ARGS}}

  migration:initial:
    desc: Create the initial baseline migration
    cmds:
      - bun --env-file=../../.env run --cwd {{.API_DIR}} migration:create -- --initial

  migration:blank:
    desc: Create a blank migration file to write custom SQL
    cmds:
      - bun --env-file=../../.env run --cwd {{.API_DIR}} migration:create -- --blank {{.CLI_ARGS}}

  migration:up:
    desc: Run pending migrations
    cmds:
      - bun --env-file=../../.env run --cwd {{.API_DIR}} migration:up

  migration:down:
    desc: Roll back last migration
    cmds:
      - bun --env-file=../../.env run --cwd {{.API_DIR}} migration:down

  migration:pending:
    desc: List all pending migrations
    cmds:
      - bun --env-file=../../.env run --cwd {{.API_DIR}} migration:pending

  migration:fresh:
    desc: Drop database schema and re-run all migrations from scratch
    cmds:
      - bun --env-file=../../.env run --cwd {{.API_DIR}} migration:fresh

  # ---------------------------------------------------------------------------
  # Local Development
  # ---------------------------------------------------------------------------
  infra:up:
    desc: Start PostgreSQL and Redis for local development
    cmds:
      - docker compose up -d --wait postgres redis

  infra:down:
    desc: Stop PostgreSQL and Redis
    cmds:
      - docker compose stop postgres redis

  dev:
    desc: Start local API and web apps with Docker-backed infrastructure
    deps: [infra:up]
    cmds:
      - task: migration:up
      - bun --env-file=.env run dev

  # ---------------------------------------------------------------------------
  # Docker Utilities
  # ---------------------------------------------------------------------------
  watch:
    desc: Start all application and infrastructure containers with watch mode
    cmds:
      - docker compose up --watch --build

  up:
    desc: Start all containers in background
    cmds:
      - docker compose up -d

  down:
    desc: Stop all containers
    cmds:
      - docker compose down

  clean:
    desc: Stop all containers
    cmds:
      - docker compose down

  logs:
    desc: Tail API service logs
    cmds:
      - docker compose logs -f {{.DOCKER_SERVICE}}

  sh:
    desc: Open an interactive shell inside the API container
    interactive: true
    cmds:
      - docker compose exec -it -w /app/{{.API_DIR}} {{.DOCKER_SERVICE}} sh

  contract:build:
    cmd: bun --cwd packages/contract build
