name: movie-reservation
services:
  postgres:
    image: postgres:18-alpine
    container_name: movie-reservation-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dedicated migration container (runs to completion on boot)
  migrator:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    restart: "no"
    command: bun run --cwd apps/api migration:up
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Ensures new migration files written by the CLI sync to your host machine
      - ./apps/api/src/common/infrastructure/database/migrations:/app/apps/api/src/common/infrastructure/database/migrations

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    command: bun --cwd apps/api start:dev
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully # Waits until migrations succeed
    develop:
      watch:
        # Rebuild container on dependency updates
        - action: rebuild
          path: package.json
        - action: rebuild
          path: apps/api/package.json
        - action: rebuild
          path: packages/contract/package.json

        # Sync API source code
        - action: sync
          path: ./apps/api/src
          target: /app/apps/api/src
          ignore:
            - node_modules/
            - dist/

        # Sync Contract source code
        - action: sync
          path: ./packages/contract/src
          target: /app/packages/contract/src
          ignore:
            - node_modules/
            - dist/

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bun run --cwd apps/web dev
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: rebuild
          path: package.json
        - action: rebuild
          path: bun.lock
        - action: rebuild
          path: apps/web/package.json

        - action: sync
          path: ./apps/web/src
          target: /app/apps/web/src
          ignore:
            - node_modules/
        - action: sync
          path: ./apps/web/index.html
          target: /app/apps/web/index.html
        - action: sync
          path: ./apps/web/vite.config.ts
          target: /app/apps/web/vite.config.ts

volumes:
  postgres_data:
  redis_data: